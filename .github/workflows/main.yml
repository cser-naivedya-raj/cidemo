name: GitHub Secrets Demo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual run from GitHub Actions UI

jobs:
  demonstrate-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Demo Script
        # We inject the secret value from the GitHub Secrets context into an environment variable.
        # This keeps the secret out of the code and repository source files.
        env:
          MY_SECRET_TOKEN: ${{ secrets.MY_SECRET_TOKEN }}
        run: python main.py
